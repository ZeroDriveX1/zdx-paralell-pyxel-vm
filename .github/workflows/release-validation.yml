name: release-validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-full:
    name: full-python-${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-constraints.txt -r requirements-dev.txt -r requirements-security.txt
      - name: Compile all Python modules
        run: python -m compileall -q .
      - name: Run complete test suite
        run: pytest -q

  auth-network-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -c requirements-constraints.txt -r requirements-dev.txt -r requirements-security.txt
      - name: Repeat auth, re-auth, TLS and network-fault validation
        run: |
          for pass in 1 2 3; do
            echo "security/network pass $pass"
            pytest -q               test_auth_pipeline.py               test_network_auth.py               test_network_faults.py               test_tls.py               tests/test_zdx_rectification.py               tests/test_release_validation.py
          done

  distributed-resource-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -c requirements-constraints.txt -r requirements-dev.txt -r requirements-security.txt
      - name: Repeat distributed compute, lease, RAM and spatial admission
        run: |
          for pass in 1 2 3; do
            echo "compute/resource pass $pass"
            pytest -q               test_compute_resources.py               test_compute_leases.py               test_distributed_deployment.py               test_spatial_compute.py               tests/test_release_validation.py
          done

  persistence-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -c requirements-constraints.txt -r requirements-dev.txt -r requirements-security.txt
      - name: Validate persistence, corruption recovery and hard-kill behavior
        run: |
          pytest -q             test_persistence_integration.py             test_power_loss.py             test_storage.py             test_operational_validation.py


  worker-sandbox-linux:
    name: rootless-podman-sandbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provision local rootless OCI runtime
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends podman uidmap slirp4netns fuse-overlayfs
          fi
          podman --version
          podman info --format '{{.Host.CgroupsVersion}}'
      - name: Build immutable executor image
        run: |
          podman build -f packaging/Dockerfile.worker-sandbox -t localhost/zdx-pyxel-executor:ci .
          image_id="$(podman image inspect localhost/zdx-pyxel-executor:ci --format '{{.Id}}')"
          digest="${image_id#sha256:}"
          [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]] || exit 1
          echo "ZDX_SANDBOX_IMAGE=sha256:$digest" >> "$GITHUB_ENV"
      - name: Exercise real rootless sandbox with valid and malformed frames
        run: |
          python -m pip install -c requirements-constraints.txt -r requirements-dev.txt -r requirements-security.txt
          pytest -v tests/test_desktop_sandbox_integration.py

  android-release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile and lint Android node
        run: gradle -p android :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: Upload debug APK and lint report
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-debug.html
      - name: Enable KVM for emulator validation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise isolated PNG execution on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            gradle -p android :app:connectedDebugAndroidTest --stacktrace
            adb logcat -d -v raw -s ZDXInterop:I > "$RUNNER_TEMP/pyxel-attestation-test.log"
            python3 -m venv "$RUNNER_TEMP/pyxel-verifier"
            "$RUNNER_TEMP/pyxel-verifier/bin/python" -m pip install -r requirements-security.txt
            PYTHONPATH=. "$RUNNER_TEMP/pyxel-verifier/bin/python" tests/verify_android_attestation.py "$RUNNER_TEMP/pyxel-attestation-test.log"
